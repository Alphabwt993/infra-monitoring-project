services:
  # 1. Сервис API (наш "сервис мониторинга")
  api:
    image: hashicorp/http-echo
    # Передаем аргументы команде: текст, который он будет отдавать, и порт, на котором слушать
    command: -text="Monitoring Service Active" -listen=:8080
    networks:
      - monitoring_net
    # Порты наружу выставлять не обязательно, так как к нему будет обращаться только Nginx,
    # но можно добавить для отладки: ports: - "8080:8080"

  # 2. Сервис Proxy (Nginx)
  proxy:
    image: nginx:alpine
    ports:
      - "80:80" # Пробрасываем 80-й порт контейнера на 80-й порт нашего компьютера
    volumes:
      # Монтируем конфиг Nginx, чтобы научить его перенаправлять трафик
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - monitoring_net
    depends_on:
      - api

# 3. Настройка внутренней сети Docker
networks:
  monitoring_net:
    driver: bridge 
